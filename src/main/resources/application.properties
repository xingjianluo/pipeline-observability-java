# ===== 数据管道可观测性服务配置 =====
# 允许接入的事件协议版本；不在列表内的事件以 UNSUPPORTED_PROTOCOL_VERSION 拒绝
observability.supported-protocol-versions[0]=1.0
observability.supported-protocol-versions[1]=1.1

# 默认新鲜度阈值(ms)：距上次成功超过该值才进入 STALE（等号边界不告警）
observability.default-freshness-threshold-ms=3600000
# 抖动宽限(ms)：超过阈值但落在宽限内判为 TRANSIENT_JITTER，不产生正式告警
observability.default-jitter-grace-ms=300000
# 默认 SLA 上限(ms)：RUNNING 持续超过该值判 SLA_BREACHED
observability.default-sla-limit-ms=7200000
# 默认调度间隔(ms) 与 调度滞后宽限(ms)
observability.default-schedule-interval-ms=3600000
observability.default-schedule-grace-ms=120000
# 告警升级时长(ms)：WARNING 持续超过该值升级为 CRITICAL
observability.escalation-after-ms=1800000

# 管道级覆盖示例（按需启用）
#observability.pipelines.daily-etl.freshness-threshold-ms=7200000
#observability.pipelines.daily-etl.sla-limit-ms=14400000
# 周期调度管道：显式配置调度间隔与宽限后，按“下一轮本该何时跑”判定错过轮次；
# 未配置调度间隔/宽限的管道仍只按新鲜度判定，不会被强套周期告警。
#observability.pipelines.hourly-job.schedule-interval-ms=3600000
#observability.pipelines.hourly-job.schedule-grace-ms=120000
# 调大/调小 interval，错过轮次与 HEALTHY/SCHEDULE_LAGGING 结论会随之变化。

logging.level.com.github.xingjianluo.pipelineobservabilityjava=INFO
