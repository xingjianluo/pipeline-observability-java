# 管道可观测性与告警聚合服务配置
# 评估周期（ms）
pipeline.observability.evaluation-interval-ms=5000
# 是否启用内置周期调度（单测中可置 false 并手动 /api/health/tick）
pipeline.observability.scheduler-enabled=true

# 全局默认阈值（可被 pipeline.observability.pipelines.<id>.* 覆盖）
pipeline.observability.defaults.never-succeeded-grace-ms=60000
pipeline.observability.defaults.freshness-threshold-ms=300000
pipeline.observability.defaults.schedule-interval-ms=0
pipeline.observability.defaults.schedule-tolerance-ms=30000
pipeline.observability.defaults.sla-run-duration-ms=0
pipeline.observability.defaults.jitter-grace-ms=60000
pipeline.observability.defaults.escalation-after-ms=900000
